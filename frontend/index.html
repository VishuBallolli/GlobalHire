<!DOCTYPE html>
<html>
    <head>
        <title>GlobalHire</title>
        <meta charset="UTF-8">

        <link rel="stylesheet" href="style.css">

        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
            rel="stylesheet"
        >
    </head>

    <body>

        <header>
            <h1 id="main-title">GlobalHire</h1>

            <nav class="navbar navbar-expand-lg gap-3">
                <a href="#">Home</a>
                <a href="#">Jobs</a>
                <a href="#">Login</a>
                <a href="#">Register</a>
            </nav>
        </header>

        <!-- JavaScript will create job cards here -->
        <section id="jobs-container"></section>

        <main class="container">

            <!-- Hero Section -->
            <section class="text-center py-5">
                <h2>Find Your Next International Opportunity</h2>

                <p>
                    Discover jobs and career opportunities around the world.
                </p>
            </section>

            <!-- Search Jobs -->
            <section>
                <h2>Search Jobs</h2>

<form id="job-search-form" class="gap-2">   
     <input
    id="job-search"
    type="text"
    class="form-control"
    placeholder="Job title or skill">

<input
    id="country-search"
    type="text"
    class="form-control"
    placeholder="Country">

<button id="search-button" type="submit" class="btn btn-primary">
    Search
</button>                </form>
            </section>

        </main>

        <footer>
            <p>&copy; 2026 GlobalHire. All rights reserved.</p>
        </footer>

        <script src="script.js"></script>

    </body>
</html>
