
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GlobalHire</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header>
        <h1 id="main-title">GlobalHire</h1>

        <nav class="navbar navbar-expand-lg gap-3" aria-label="Main navigation">
            <a href="#">Home</a>
            <a href="#jobs-container">Jobs</a>
            <a href="#login-section">Login</a>
            <a href="#register-section">Register</a>
        </nav>
    </header>

    <main class="container">
        <!-- Hero Section -->
        <section class="text-center py-5">
            <h2>Find Your Next International Opportunity</h2>
            <p>Discover jobs and career opportunities around the world.</p>
        </section>

        <!-- Search Jobs -->
        <section aria-labelledby="search-heading">
            <h2 id="search-heading">Search Jobs</h2>

            <form id="job-search-form" class="gap-2">
                <div class="flex-grow-1">
                    <label for="job-search" class="form-label">Job title</label>
                    <input
                        id="job-search"
                        name="jobTitle"
                        type="text"
                        class="form-control"
                        placeholder="e.g. Python Developer"
                    >
                </div>

                <div class="flex-grow-1">
                    <label for="country-search" class="form-label">Country</label>
                    <input
                        id="country-search"
                        name="country"
                        type="text"
                        class="form-control"
                        placeholder="e.g. Canada"
                    >
                </div>

                <div class="align-self-end">
                    <button id="search-button" type="submit" class="btn btn-primary">
                        Search
                    </button>
                </div>
            </form>

            <p id="search-error" class="text-danger mt-3" role="alert"></p>
            <section id="jobs-container" aria-label="Job search results"></section>
        </section>

        <!-- Login Section -->
        <section id="login-section" class="mt-4" aria-labelledby="login-heading">
            <h2 id="login-heading">Login</h2>

            <form id="login-form">
                <div class="mb-3">
                    <label for="login-email" class="form-label">Email</label>
                    <input
                        id="login-email"
                        name="email"
                        type="email"
                        class="form-control"
                        required
                    >
                </div>

                <div class="mb-3">
                    <label for="login-password" class="form-label">Password</label>
                    <input
                        id="login-password"
                        name="password"
                        type="password"
                        class="form-control"
                        required
                    >
                </div>

                <button type="submit" class="btn btn-primary">Login</button>
                <p id="login-message" class="mt-3" role="status"></p>
            </form>
        </section>

        <!-- Register Section -->
        <section id="register-section" class="mt-4" aria-labelledby="register-heading">
            <h2 id="register-heading">Register</h2>

            <form id="register-form">
                <div class="mb-3">
                    <label for="register-name" class="form-label">Full Name</label>
                    <input
                        id="register-name"
                        name="name"
                        type="text"
                        class="form-control"
                        minlength="2"
                        maxlength="100"
                        required
                    >
                </div>

                <div class="mb-3">
                    <label for="register-email" class="form-label">Email</label>
                    <input
                        id="register-email"
                        name="email"
                        type="email"
                        class="form-control"
                        maxlength="255"
                        required
                    >
                </div>

                <div class="mb-3">
                    <label for="register-password" class="form-label">Password</label>
                    <input
                        id="register-password"
                        name="password"
                        type="password"
                        class="form-control"
                        minlength="8"
                        maxlength="72"
                        required
                    >
                </div>

                <button type="submit" class="btn btn-success">Register</button>
                <p id="register-message" class="mt-3" role="status"></p>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 GlobalHire. All rights reserved.</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
