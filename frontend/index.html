<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <title>GlobalHire</title>

        <!-- Bootstrap CSS -->
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
            rel="stylesheet"
        >

        <!-- Custom CSS -->
        <link rel="stylesheet" href="style.css">
    </head>

    <body>

        <!-- Header and Navigation -->
        <header>
            <h1 id="main-title">GlobalHire</h1>

            <nav class="navbar navbar-expand-lg gap-3" aria-label="Main navigation">
                <a href="#">Home</a>
                <a href="#jobs-container">Jobs</a>
                <a href="#">Login</a>
                <a href="#">Register</a>
            </nav>
        </header>

        <main class="container">

            <!-- Hero Section -->
            <section class="text-center py-5">
                <h2>Find Your Next International Opportunity</h2>

                <p>
                    Discover jobs and career opportunities around the world.
                </p>
            </section>

            <!-- Search Jobs -->
            <section aria-labelledby="search-heading">
                <h2 id="search-heading">Search Jobs</h2>

                <form id="job-search-form" class="gap-2">

                    <div class="flex-grow-1">
                        <label for="job-search" class="form-label">
                            Job title
                        </label>

                        <input
                            id="job-search"
                            name="jobTitle"
                            type="text"
                            class="form-control"
                            placeholder="e.g. Python Developer"
                        >
                    </div>

                    <div class="flex-grow-1">
                        <label for="country-search" class="form-label">
                            Country
                        </label>

                        <input
                            id="country-search"
                            name="country"
                            type="text"
                            class="form-control"
                            placeholder="e.g. Canada"
                        >
                    </div>

                    <div class="align-self-end">
                        <button
                            id="search-button"
                            type="submit"
                            class="btn btn-primary"
                        >
                            Search
                        </button>
                    </div>

                </form>

                <p id="search-error" class="text-danger mt-3" role="alert"></p>

                <!-- JavaScript displays matching jobs here -->
                <section id="jobs-container" aria-label="Job search results"></section>

            </section>

        </main>

        <!-- Footer -->
        <footer>
            <p>&copy; 2026 GlobalHire. All rights reserved.</p>
        </footer>

        <!-- JavaScript -->
        <script src="script.js"></script>

    </body>
</html>
